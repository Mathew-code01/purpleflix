<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ==========================================================
       Basic
  =========================================================== -->
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>PurpleFlix | Discover Movies & TV Shows</title>

  <meta
    name="description"
    content="PurpleFlix helps you discover trending movies, TV shows, top-rated films, upcoming releases, and explore genres powered by The Movie Database (TMDB)."
  />

  <meta
    name="keywords"
    content="movies, tv shows, tmdb, purpleflix, movie database, trending movies, top rated movies, upcoming movies, streaming"
  />

  <meta name="author" content="Mathew Oloyede" />
  <meta name="application-name" content="PurpleFlix" />
  <meta name="apple-mobile-web-app-title" content="PurpleFlix" />
  <meta name="theme-color" content="#7C3AED" />
  <meta name="color-scheme" content="light dark" />

  <!-- ==========================================================
       Favicons
  =========================================================== -->

  <link rel="icon" href="/favicon.ico" sizes="any">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32x32.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16x16.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/apple-touch-icon.png"
  >

  <link rel="manifest" href="/site.webmanifest">

  <!-- ==========================================================
       Open Graph (Facebook, LinkedIn, Discord)
  =========================================================== -->

  <meta property="og:type" content="website">

  <meta property="og:site_name" content="PurpleFlix">

  <meta
    property="og:title"
    content="PurpleFlix | Discover Movies & TV Shows"
  >

  <meta
    property="og:description"
    content="Browse trending movies, discover TV series, explore genres and stay updated with the latest entertainment."
  >

  <meta
    property="og:url"
    content="https://purpleflix.netlify.app/"
  >

  <meta
    property="og:image"
    content="https://purpleflix.netlify.app/social-preview.png"
  >

  <meta property="og:image:width" content="1200">

  <meta property="og:image:height" content="630">

  <meta property="og:locale" content="en_US">

  <!-- ==========================================================
       Twitter / X
  =========================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="PurpleFlix | Discover Movies & TV Shows"
  >

  <meta
    name="twitter:description"
    content="Find trending movies, top-rated films and TV series powered by TMDB."
  >

  <meta
    name="twitter:image"
    content="https://purpleflix.netlify.app/social-preview.png"
  >

  <meta
    name="twitter:creator"
    content="@MathewOloy88336"
  >

  <!-- ==========================================================
       Robots
  =========================================================== -->

  <meta
    name="robots"
    content="index, follow"
  />

  <meta
    name="googlebot"
    content="index,follow"
  />

  <!-- ==========================================================
       Canonical
  =========================================================== -->

  <link
    rel="canonical"
    href="https://purpleflix.netlify.app/"
  />

</head>

<body>

  <noscript>
    PurpleFlix requires JavaScript to run properly.
  </noscript>

  <div id="root"></div>

  <script
    type="module"
    src="/src/index.jsx"
  ></script>

</body>
</html>
